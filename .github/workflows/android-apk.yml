name: Compilar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    name: APK release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Completar archivos generados de Android
        run: flutter create --platforms=android --org com.tusolution --project-name tu_solution .
      - name: Dependencias
        run: flutter pub get
      - name: Generar clases Drift
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analizar código
        run: flutter analyze
      - name: Ejecutar pruebas
        run: flutter test
      - name: Compilar APK instalable
        run: flutter build apk --release
      - name: Publicar APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Tu-Solution-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
